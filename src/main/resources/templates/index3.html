<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #fafafa;
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* --- Navbar --- */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 48px;
            background-color: #fff;
            border-bottom: 1px solid #eaeaea;
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #1a1a1a;
            text-decoration: none;
        }

        .navbar-back {
            font-size: 14px;
            font-weight: 500;
            color: #555;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.25s ease;
        }

        .navbar-back:hover {
            color: #1a1a1a;
        }

        /* --- Main Content --- */
        .main-content {
            flex: 1;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 60px 24px 80px;
        }

        .form-container {
            width: 100%;
            max-width: 560px;
            background-color: #fff;
            border: 1px solid #e8e8e8;
            border-radius: 20px;
            padding: 48px 40px;
            animation: fadeInUp 0.5s ease forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-header {
            margin-bottom: 36px;
            padding-bottom: 24px;
            border-bottom: 1px solid #f0f0f0;
        }

        .form-title {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 6px;
        }

        .form-description {
            font-size: 14px;
            color: #888;
            font-weight: 400;
        }

        /* --- Alert Message --- */
        .alert {
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 28px;
            background-color: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        /* --- Form Fields --- */
        .form-group {
            margin-bottom: 24px;
        }

        .form-group:last-of-type {
            margin-bottom: 32px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #444;
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            color: #1a1a1a;
            background-color: #fafafa;
            border: 1.5px solid #e0e0e0;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.25s ease, background-color 0.25s ease, box-shadow 0.25s ease;
        }

        .form-input:hover {
            border-color: #c0c0c0;
        }

        .form-input:focus {
            border-color: #1a1a1a;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(26, 26, 26, 0.06);
        }

        .form-input::placeholder {
            color: #bbb;
        }

        /* --- Submit Button --- */
        .btn-submit {
            width: 100%;
            padding: 14px 24px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            background-color: #1a1a1a;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
        }

        .btn-submit:hover {
            background-color: #333;
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* --- Footer --- */
        .footer {
            text-align: center;
            padding: 24px 48px;
            border-top: 1px solid #eaeaea;
            background-color: #fff;
        }

        .footer p {
            font-size: 13px;
            color: #999;
        }

        /* --- Responsive --- */
        @media (max-width: 640px) {
            .navbar {
                padding: 16px 20px;
            }

            .main-content {
                padding: 32px 16px 60px;
            }

            .form-container {
                padding: 32px 24px;
                border-radius: 16px;
            }

            .form-title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="/" class="navbar-brand" th:text="${profile.nama}">PORTFOLIO</a>
        <a href="/profile" class="navbar-back">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Kembali ke Profile
        </a>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="form-container">

            <div class="form-header">
                <h1 class="form-title">Edit Profile</h1>
                <p class="form-description">Perbarui informasi profil Anda di bawah ini.</p>
            </div>

            <p th:if="${message}" th:text="${message}" class="alert"></p>

            <form method="POST" th:object="${profile}">

                <input type="hidden" th:field="*{id}">

                <div class="form-group">
                    <label class="form-label" for="nama">Nama</label>
                    <input type="text" th:field="*{nama}" id="nama" class="form-input" placeholder="Masukkan nama">
                </div>

                <div class="form-group">
                    <label class="form-label" for="deskripsi">Deskripsi</label>
                    <input type="text" th:field="*{deskripsi}" id="deskripsi" class="form-input" placeholder="Deskripsi singkat tentang Anda">
                </div>

                <div class="form-group">
                    <label class="form-label" for="profesi">Profesi</label>
                    <input type="text" th:field="*{profesi}" id="profesi" class="form-input" placeholder="Profesi Anda">
                </div>

                <div class="form-group">
                    <label class="form-label" for="pendidikan">Pendidikan</label>
                    <input type="text" th:field="*{pendidikan}" id="pendidikan" class="form-input" placeholder="Pendidikan terakhir">
                </div>

                <div class="form-group">
                    <label class="form-label" for="lokasi">Lokasi</label>
                    <input type="text" th:field="*{lokasi}" id="lokasi" class="form-input" placeholder="Lokasi Anda">
                </div>

                <div class="form-group">
                    <label class="form-label" for="foto">Foto</label>
                    <input type="text" th:field="*{foto}" id="foto" class="form-input" placeholder="Nama file foto (contoh: foto.jpg)">
                </div>

                <button type="submit" class="btn-submit">Simpan Perubahan</button>

            </form>

        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>Edit Profile</p>
    </footer>

</body>
</html>
