<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head>
    <meta charset="UTF-8">
    <meta email="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Edit kontak - ' + ${kontak.email}">Edit kontak</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/dashboard-form.css}" href="/css/dashboard-form.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-brand-group">
            <a href="/" class="navbar-brand">PORTFOLIO</a>
            <span class="navbar-divider">/</span>
            <span class="navbar-tag">Dashboard kontak</span>
        </div>

        <div class="navbar-nav">
            <a th:href="@{/kontak}" class="navbar-back">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Daftar kontak
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="form-wrapper">
            <div class="form-card">

                <div class="card-badge">
                    <span class="card-badge-dot"></span>
                    <span>Modul kontak</span>
                </div>

                <div class="form-header">
                    <h1 class="form-title">Edit kontak</h1>
                <p class="form-description">Perbarui informasi kontak yang ditampilkan pada halaman portfolio.</p>
                </div>

                <!-- Alert Message -->
                <div th:if="${message}" class="alert">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                    <span th:text="${message}">Perubahan berhasil disimpan.</span>
                </div>

                <!-- Form -->
               <form th:action="@{/kontak/edit}" th:object="${kontak}" method="post">

        <input type="hidden" th:field="*{id}">

        <div class="form-group">
            <label>Email</label>
            <input type="email"
                th:field="*{email}"
                class="form-input"
                placeholder="Masukkan email"
                required>
        </div>

        <div class="form-group">
            <label>WhatsApp</label>
            <input type="text"
                th:field="*{whatsapp}"
                class="form-input"
                placeholder="Masukkan nomor WhatsApp"
                required>
        </div>

        <div class="form-group">
            <label>GitHub</label>
            <input type="url"
                th:field="*{github}"
                class="form-input"
                placeholder="https://github.com/useremail">
        </div>

        <div class="form-group">
            <label>Instagram</label>
            <input type="url"
                th:field="*{instagram}"
                class="form-input"
                placeholder="https://instagram.com/useremail">
        </div>

        <div class="form-actions">
            <a th:href="@{/kontak}" class="btn-cancel">Batal</a>

            <button type="submit" class="btn-submit">
                Simpan Perubahan
            </button>
        </div>

        </form> 

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 Portfolio Dashboard. Semua Hak Dilindungi.</p>
    </footer>

    <script>
        // Live preview synchronization

        if (emailInput && previewemail) {
            emailInput.addEventListener('input', (e) => {
                const val = e.target.value.trim();
                previewemail.textContent = val.length > 0 ? val : 'Nama kontak';
            });
        }

        if (prosesSelect && previewStatusBadge && previewStatusText) {
            prosesSelect.addEventListener('change', (e) => {
                const val = e.target.value;
                previewStatusText.textContent = val;
                if (val.toLowerCase().includes('sedang')) {
                    previewStatusBadge.classList.remove('completed');
                    previewStatusBadge.classList.add('learning');
                } else {
                    previewStatusBadge.classList.remove('learning');
                    previewStatusBadge.classList.add('completed');
                }
            });
        }
    </script>
</body>
</html>
