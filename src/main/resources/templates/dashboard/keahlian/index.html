<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Keahlian - Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            -webkit-font-smoothing: antialiased;
        }

        /* --- Sidebar --- */
        .sidebar {
            width: 260px;
            background-color: #ffffff;
            border-right: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 50;
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
        }

        .brand-name {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #0f172a;
        }

        .sidebar-menu {
            padding: 20px 14px;
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .menu-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            padding: 10px 12px 6px;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #475569;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .sidebar-link:hover {
            color: #0f172a;
            background-color: #f1f5f9;
        }

        .sidebar-link.active {
            color: #0f172a;
            background-color: #e2e8f0;
            font-weight: 600;
        }

        .sidebar-link svg {
            width: 18px;
            height: 18px;
            stroke-width: 2;
            color: inherit;
        }

        .sidebar-footer {
            padding: 16px 14px;
            border-top: 1px solid #f1f5f9;
        }

        .sidebar-footer-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #0f172a;
            background-color: #f1f5f9;
            text-decoration: none;
            border: 1px solid #e2e8f0;
            transition: all 0.2s ease;
        }

        .sidebar-footer-link:hover {
            background-color: #0f172a;
            color: #ffffff;
            border-color: #0f172a;
        }

        /* --- Main Content --- */
        .main-wrapper {
            margin-left: 260px;
            flex: 1;
            padding: 40px 48px 60px;
            max-width: 1200px;
        }

        .page-header {
            margin-bottom: 28px;
        }

        .page-title {
            font-size: 26px;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -0.4px;
            margin-bottom: 6px;
        }

        .page-description {
            font-size: 14px;
            color: #64748b;
        }

        /* --- Table Card --- */
        .table-card {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.04);
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        thead {
            background-color: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            padding: 14px 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #475569;
        }

        th.th-num { width: 80px; }
        th.th-action { width: 120px; text-align: right; }

        tbody tr {
            border-bottom: 1px solid #f1f5f9;
            transition: background-color 0.15s ease;
        }

        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background-color: #f8fafc; }

        td {
            padding: 16px 20px;
            font-size: 14px;
            color: #334155;
            vertical-align: middle;
        }

        .td-num {
            font-weight: 500;
            color: #94a3b8;
            font-size: 13px;
        }

        .td-name {
            font-weight: 600;
            color: #0f172a;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 500;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .status-badge.completed {
            background-color: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .status-badge.completed .status-dot {
            background-color: #22c55e;
        }

        .status-badge.learning {
            background-color: #eff6ff;
            color: #1e40af;
            border: 1px solid #bfdbfe;
        }

        .status-badge.learning .status-dot {
            background-color: #3b82f6;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .td-action { text-align: right; }

        .btn-edit {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            color: #0f172a;
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-edit:hover {
            background-color: #0f172a;
            color: #ffffff;
            border-color: #0f172a;
        }

        @media (max-width: 900px) {
            .sidebar { width: 70px; }
            .sidebar .brand-name, .sidebar .menu-label, .sidebar-link span, .sidebar-footer-link span { display: none; }
            .sidebar-header, .sidebar-link, .sidebar-footer-link { justify-content: center; padding: 12px; }
            .main-wrapper { margin-left: 70px; padding: 24px 16px 40px; }
        }
    </style>
</head>
<body>

    <!-- Sidebar Navigation -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="brand-logo">A</div>
            <span class="brand-name">Portfolio Admin</span>
        </div>

        <ul class="sidebar-menu">
            <li class="menu-label">Menu Utama</li>
            <li>
                <a href="/dashboard" class="sidebar-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                    <span>Dashboard</span>
                </a>
            </li>
            <li>
                <a href="/template3" class="sidebar-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    <span>Profile</span>
                </a>
            </li>
            <li>
                <a href="/keahlian" class="sidebar-link active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
                    <span>Keahlian</span>
                </a>
            </li>
            <li>
                <a href="/project" class="sidebar-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
                    <span>Project</span>
                </a>
            </li>
        </ul>

        <div class="sidebar-footer">
            <a href="/profile" class="sidebar-footer-link">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                <span>Lihat Website</span>
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-wrapper">
        
        <div class="page-header">
            <h1 class="page-title">Kelola Data Keahlian</h1>
            <p class="page-description">Daftar kemampuan teknis dan progres pembelajaran yang terdaftar di portofolio.</p>
        </div>

        <div class="table-card">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th class="th-num">No</th>
                            <th>Keahlian</th>
                            <th>Status Pembelajaran</th>
                            <th class="th-action">Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="keahlian, stat : ${keahlianList}">
                            <td class="td-num" th:text="${stat.count}">1</td>
                            <td class="td-name" th:text="${keahlian.name}">PHP</td>
                            <td>
                                <span class="status-badge" th:classappend="${keahlian.proses != null && #strings.containsIgnoreCase(keahlian.proses, 'sedang')} ? 'learning' : 'completed'">
                                    <span class="status-dot"></span>
                                    <span th:text="${keahlian.proses != null ? keahlian.proses : 'Sudah Dipelajari'}">Sudah Dipelajari</span>
                                </span>
                            </td>
                            <td class="td-action">
                                <a th:href="@{/keahlian/edit/{id}(id=${keahlian.id})}" class="btn-edit">
                                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                                    Edit
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

</body>
</html>
