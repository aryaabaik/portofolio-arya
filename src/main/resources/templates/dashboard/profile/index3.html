<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Edit Profile - ' + ${profile != null && profile.nama != null ? profile.nama : 'Dashboard'}">Edit Profile</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #fafafa;
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* --- Navbar --- */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 48px;
            background-color: #fff;
            border-bottom: 1px solid #eaeaea;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #1a1a1a;
            text-decoration: none;
        }

        .navbar-back {
            font-size: 14px;
            font-weight: 500;
            color: #555;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.25s ease;
        }

        .navbar-back:hover {
            color: #1a1a1a;
        }

        /* --- Main Content --- */
        .main-content {
            flex: 1;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 60px 24px 80px;
        }

        .form-container {
            width: 100%;
            max-width: 580px;
            background-color: #fff;
            border: 1px solid #e8e8e8;
            border-radius: 20px;
            padding: 48px 40px;
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.04);
            animation: fadeInUp 0.5s ease forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-header {
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid #f0f0f0;
        }

        .form-title {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 6px;
        }

        .form-description {
            font-size: 14px;
            color: #888;
            font-weight: 400;
        }

        /* --- Alert Message --- */
        .alert {
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 28px;
            background-color: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        /* --- Form Fields --- */
        .form-group {
            margin-bottom: 22px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #444;
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }

        .form-input,
        .form-textarea {
            width: 100%;
            padding: 12px 16px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            color: #1a1a1a;
            background-color: #fafafa;
            border: 1.5px solid #e0e0e0;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.25s ease, background-color 0.25s ease, box-shadow 0.25s ease;
        }

        .form-textarea {
            min-height: 90px;
            resize: vertical;
            line-height: 1.5;
        }

        .form-input:hover,
        .form-textarea:hover {
            border-color: #c0c0c0;
        }

        .form-input:focus,
        .form-textarea:focus {
            border-color: #1a1a1a;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(26, 26, 26, 0.06);
        }

        .form-input::placeholder,
        .form-textarea::placeholder {
            color: #bbb;
        }

        .form-hint {
            font-size: 12px;
            color: #999;
            margin-top: 6px;
        }

        /* --- Action Buttons --- */
        .form-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 32px;
        }

        .btn-submit {
            flex: 1;
            padding: 14px 24px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            background-color: #1a1a1a;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
        }

        .btn-submit:hover {
            background-color: #333;
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-cancel {
            padding: 14px 20px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            color: #555;
            background-color: #f5f5f5;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            text-decoration: none;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .btn-cancel:hover {
            background-color: #eaeaea;
            color: #1a1a1a;
        }

        /* --- Footer --- */
        .footer {
            text-align: center;
            padding: 24px 48px;
            border-top: 1px solid #eaeaea;
            background-color: #fff;
        }

        .footer p {
            font-size: 13px;
            color: #999;
        }

        /* --- Responsive --- */
        @media (max-width: 640px) {
            .navbar {
                padding: 16px 20px;
            }

            .main-content {
                padding: 32px 16px 60px;
            }

            .form-container {
                padding: 32px 24px;
                border-radius: 16px;
            }

            .form-title {
                font-size: 20px;
            }

            .form-actions {
                flex-direction: column-reverse;
                gap: 10px;
            }

            .btn-submit,
            .btn-cancel {
                width: 100%;
                text-align: center;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="/" class="navbar-brand" th:text="${profile != null ? profile.nama : 'PORTFOLIO'}">PORTFOLIO</a>
        <a th:href="@{/template3}" class="navbar-back">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Kembali ke Daftar Profil
        </a>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="form-container">

            <div class="form-header">
                <h1 class="form-title">Edit Profile</h1>
                <p class="form-description">Perbarui informasi profil Anda di bawah ini.</p>
            </div>

            <p th:if="${message}" th:text="${message}" class="alert"></p>

            <form th:action="@{/template3/edit}" method="POST" th:object="${profile}">

                <input type="hidden" th:field="*{id}">

                <div class="form-group">
                    <label class="form-label" for="nama">Nama Lengkap</label>
                    <input type="text" th:field="*{nama}" id="nama" class="form-input" placeholder="Masukkan nama lengkap" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="profesi">Profesi</label>
                    <input type="text" th:field="*{profesi}" id="profesi" class="form-input" placeholder="Contoh: Programmer, Web Developer" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="deskripsi">Deskripsi</label>
                    <textarea th:field="*{deskripsi}" id="deskripsi" class="form-textarea" placeholder="Deskripsi singkat tentang Anda"></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label" for="pendidikan">Pendidikan</label>
                    <input type="text" th:field="*{pendidikan}" id="pendidikan" class="form-input" placeholder="Pendidikan terakhir">
                </div>

                <div class="form-group">
                    <label class="form-label" for="lokasi">Lokasi</label>
                    <input type="text" th:field="*{lokasi}" id="lokasi" class="form-input" placeholder="Lokasi Anda">
                </div>

                <div class="form-group">
                    <label class="form-label" for="foto">Foto</label>
                    <input type="text" th:field="*{foto}" id="foto" class="form-input" placeholder="Nama file foto (contoh: arya.png, profile.jpg)">
                    <p class="form-hint">Letakkan file gambar di folder <code>src/main/resources/static/images/</code>.</p>
                </div>

                <div class="form-group">
                    <label class="form-label" for="tentang">About</label>
                    <input type="text" th:field="*{tentang}" id="tentang" class="form-input" placeholder="tentang Anda">
                </div>

                <div class="form-actions">
                    <a th:href="@{/template3}" class="btn-cancel">Batal</a>
                    <button type="submit" class="btn-submit">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                            <polyline points="17 21 17 13 7 13 7 21"></polyline>
                            <polyline points="7 3 7 8 15 8"></polyline>
                        </svg>
                        Simpan Perubahan
                    </button>
                </div>

            </form>

        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>Dashboard Profil Portfolio</p>
    </footer>

</body>
</html>
