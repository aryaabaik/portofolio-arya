<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Project Baru - Dashboard</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/dashboard-form.css}" href="/css/dashboard-form.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-brand-group">
            <a href="/dashboard" class="navbar-brand">PORTFOLIO</a>
            <span class="navbar-divider">/</span>
            <span class="navbar-tag">Dashboard Project</span>
        </div>

        <div class="navbar-nav">
            <a th:href="@{/project}" class="navbar-back">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Kembali ke Project
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="form-wrapper">
            <div class="form-card">

                <div class="card-badge">
                    <span class="card-badge-dot"></span>
                    <span>Modul Project</span>
                </div>

                <div class="form-header">
                    <h1 class="form-title">Tambah Project Baru</h1>
                    <p class="form-description">Masukkan data nama, deskripsi fitur, dan file foto karya project Anda.</p>
                </div>

                <form th:action="@{/project/create}" th:object="${project}" method="post">
                    
                    <div class="form-group">
                        <label for="name" class="form-label">
                            Nama Project <span class="form-label-required">*</span>
                        </label>
                        <div class="input-wrapper">
                            <input 
                                type="text" 
                                id="name" 
                                th:field="*{name}" 
                                class="form-input" 
                                placeholder="Contoh: Toko Peralatan Sekolah" 
                                required 
                                autocomplete="off"
                            >
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="deskripsi" class="form-label">Deskripsi Project</label>
                        <textarea 
                            id="deskripsi" 
                            th:field="*{deskripsi}" 
                            class="form-textarea" 
                            placeholder="Jelaskan fitur dan teknologi yang digunakan dalam project..."
                        ></textarea>
                    </div>

                    <div class="form-group">
                        <label for="foto" class="form-label">Nama File Foto</label>
                        <div class="input-wrapper">
                            <input 
                                type="text" 
                                id="foto" 
                                th:field="*{foto}" 
                                class="form-input" 
                                placeholder="Contoh: toko.png, app.jpg" 
                                autocomplete="off"
                            >
                        </div>
                        <p class="form-hint">Letakkan file gambar di folder <code>src/main/resources/static/images/</code>.</p>
                    </div>

                    <div class="form-actions">
                        <a th:href="@{/project}" class="btn-cancel">Batal</a>
                        <button type="submit" class="btn-submit">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                            Tambah Project
                        </button>
                    </div>

                </form>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 Portfolio Dashboard. Semua Hak Dilindungi.</p>
    </footer>

</body>
</html>
