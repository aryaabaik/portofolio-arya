<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Edit Project - ' + ${project.name}">Edit Project</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 40px;
            background-color: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .navbar-brand-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #0f172a;
            text-decoration: none;
        }

        .navbar-tag {
            font-size: 12px;
            font-weight: 500;
            color: #64748b;
        }

        .navbar-back {
            font-size: 13px;
            font-weight: 500;
            color: #475569;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 8px;
            background-color: #f1f5f9;
            border: 1px solid #e2e8f0;
            transition: all 0.2s ease;
        }

        .navbar-back:hover {
            color: #0f172a;
            background-color: #e2e8f0;
        }

        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 24px 64px;
        }

        .form-card {
            width: 100%;
            max-width: 560px;
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 36px 32px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.04);
        }

        .form-header {
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid #f1f5f9;
        }

        .form-title {
            font-size: 22px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 6px;
        }

        .form-description {
            font-size: 14px;
            color: #64748b;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .form-input,
        .form-textarea {
            width: 100%;
            padding: 0 14px;
            font-family: inherit;
            font-size: 14px;
            color: #0f172a;
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-input {
            height: 44px;
        }

        .form-textarea {
            padding: 12px 14px;
            min-height: 100px;
            resize: vertical;
            line-height: 1.5;
        }

        .form-input:focus,
        .form-textarea:focus {
            border-color: #0f172a;
            box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.08);
        }

        .form-hint {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 6px;
        }

        .form-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 28px;
        }

        .btn-submit {
            flex: 1;
            height: 44px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            background-color: #0f172a;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-submit:hover {
            background-color: #1e293b;
        }

        .btn-cancel {
            height: 44px;
            padding: 0 20px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            color: #475569;
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .btn-cancel:hover {
            background-color: #f8fafc;
            color: #0f172a;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-brand-group">
            <a href="/dashboard" class="navbar-brand">PORTFOLIO</a>
            <span class="navbar-tag">/ Dashboard Project</span>
        </div>

        <a th:href="@{/project}" class="navbar-back">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Kembali ke Project
        </a>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="form-card">
            <div class="form-header">
                <h1 class="form-title">Edit Data Project</h1>
                <p class="form-description">Perbarui nama, deskripsi, dan foto karya project Anda.</p>
            </div>

            <form th:action="@{/project/edit}" th:object="${project}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="form-group">
                    <label for="name" class="form-label">Nama Project</label>
                    <input type="text" id="name" th:field="*{name}" class="form-input" placeholder="Masukkan nama project" required>
                </div>

                <div class="form-group">
                    <label for="deskripsi" class="form-label">Deskripsi Project</label>
                    <textarea id="deskripsi" th:field="*{deskripsi}" class="form-textarea" placeholder="Deskripsi fitur dan teknologi project..."></textarea>
                </div>

                <div class="form-group">
                    <label for="foto" class="form-label">Nama File Foto</label>
                    <input type="text" id="foto" th:field="*{foto}" class="form-input" placeholder="Contoh: toko.png, app.jpg">
                    <p class="form-hint">Letakkan file gambar di folder <code>src/main/resources/static/images/</code>.</p>
                </div>

                <div class="form-actions">
                    <a th:href="@{/project}" class="btn-cancel">Batal</a>
                    <button type="submit" class="btn-submit">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                        Simpan Perubahan
                    </button>
                </div>
            </form>
        </div>
    </main>

</body>
</html>
