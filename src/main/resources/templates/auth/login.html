<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <meta name="description" content="Login Admin - Arya Adhitya Portfolio">
    <title>Login Admin — Portfolio</title>

    <!-- Google Fonts: Editorial Serif + Clean Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS with cache bust -->
    <link rel="stylesheet" th:href="@{/css/login.css(v='4.0')}" href="/css/login.css?v=4.0">
</head>
<body class="login-body">

    <!-- Ambient Subtle Glows -->
    <div class="ambient-glow ambient-glow-top"></div>
    <div class="ambient-glow ambient-glow-bottom"></div>

    <!-- Background Wave Contour Lines -->
    <div class="login-wave-bg" aria-hidden="true">
        <svg class="wave-svg" viewBox="0 0 1200 320" preserveAspectRatio="none" fill="none">
            <path d="M0,180 C240,110 480,250 720,180 C960,110 1100,210 1200,160 L1200,320 L0,320 Z" fill="rgba(234, 244, 248, 0.6)"/>
            <path d="M0,220 C280,160 520,290 800,210 C1000,140 1120,250 1200,200 L1200,320 L0,320 Z" fill="rgba(47, 111, 163, 0.035)"/>
            <path d="M0,140 C220,220 460,80 700,160 C920,230 1080,100 1200,140" stroke="rgba(47, 111, 163, 0.14)" stroke-width="1.2" stroke-dasharray="6 6"/>
        </svg>
    </div>

    <!-- Minimalist Navbar -->
    <header class="navbar-header">
        <nav class="login-navbar">
            <a href="/" class="login-brand">
                <span class="brand-dot"></span>
                <span class="brand-text">PORTFOLIO</span>
            </a>
            <a th:href="@{/}" href="/" class="login-nav-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                <span>Kembali ke Website</span>
            </a>
        </nav>
    </header>

    <!-- Main Content: Single Unified Minimalist Card -->
    <main class="login-main">
        <div class="login-unified-card">

            <!-- Left Side: Clean Minimalist Portrait Photo -->
            <div class="card-visual-col">
                <div class="visual-photo-wrap">
                    <img th:src="@{/images/9.jpg}"
                         src="/images/9.jpg"
                         alt="Arya Adhitya"
                         class="visual-photo"
                         onerror="this.src='/images/arya.png'">
                    <div class="visual-overlay">
                        <div class="visual-badge">ADMIN</div>
                        <h2 class="visual-name">Arya Adhitya</h2>
                        <p class="visual-role">Web Developer &bull; SMK Assalaam</p>
                    </div>
                </div>
            </div>

            <!-- Right Side: Editorial Scrapbook Form (Matching 9.jpg Theme) -->
            <div class="card-form-col">
                <!-- Washi Tape Scrapbook Accent -->
                <div class="washi-tape-strip" aria-hidden="true"></div>

                <div class="form-inner">

                    <!-- Receipt Metadata Header (Matching 'receipt ORDER #0010' from photo) -->
                    <div class="receipt-meta-header">
                        <div class="receipt-badge-wrap">
                        </div>
                        <div class="wave-doodle-icon" aria-hidden="true" title="Wave to Earth">
                            <svg width="36" height="13" viewBox="0 0 38 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2 10C5 5 9 5 12 10C15 5 19 5 22 10C25 5 29 5 33 10C35 8 36 7 37 8" />
                                <path d="M6 12C9 8 12 8 15 12C18 8 21 8 24 12C27 8 30 8 33 12" opacity="0.45"/>
                            </svg>
                        </div>
                    </div>

                    <!-- Header -->
                    <div class="form-header">
                        <h1 class="form-title">Login <span class="form-title-tag">Portal</span></h1>
                        <p class="form-subtitle">Masukkan username dan password.</p>
                        <div class="receipt-perforated-border" aria-hidden="true">
                            <span class="perforated-text">VERIFIED ACCESS</span>
                        </div>
                    </div>

                    <!-- Alert: Error -->
                    <div th:if="${param.error != null}" class="login-alert alert-error" role="alert">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg>
                        <span>Username atau password tidak valid.</span>
                    </div>

                    <!-- Alert: Logout -->
                    <div th:if="${param.logout != null}" class="login-alert alert-success" role="alert">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                            <polyline points="22 4 12 14.01 9 11.01"></polyline>
                        </svg>
                        <span>Anda telah berhasil keluar dari sesi.</span>
                    </div>

                    <!-- Form -->
                    <form th:action="@{/login}" action="/login" method="post" class="login-form">

                        <!-- Username Input -->
                        <div class="form-group">
                            <label for="username" class="form-label">Username</label>
                            <div class="input-wrapper">
                                <span class="input-icon">
                                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                        <circle cx="12" cy="7" r="4"></circle>
                                    </svg>
                                </span>
                                <input
                                    type="text"
                                    id="username"
                                    name="username"
                                    class="form-control"
                                    placeholder="Masukkan username"
                                    required
                                    autofocus
                                    autocomplete="username"
                                    style="color: #000000 !important; -webkit-text-fill-color: #000000 !important;"
                                >
                            </div>
                        </div>

                        <!-- Password Input -->
                        <div class="form-group">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-wrapper">
                                <span class="input-icon">
                                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                    </svg>
                                </span>
                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    class="form-control"
                                    placeholder="Masukkan password"
                                    required
                                    autocomplete="current-password"
                                    style="color: #000000 !important; -webkit-text-fill-color: #000000 !important;"
                                >
                                <button
                                    type="button"
                                    id="togglePasswordBtn"
                                    class="btn-toggle-eye"
                                    aria-label="Tampilkan atau sembunyikan password"
                                    title="Lihat password"
                                >
                                    <svg id="eyeIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </svg>
                                    <svg id="eyeOffIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                        <line x1="1" y1="1" x2="23" y2="23"></line>
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="btn-login-submit" id="loginBtn">
                            <span>Masuk ke Dashboard</span>
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                                <polyline points="12 5 19 12 12 19"></polyline>
                            </svg>
                        </button>

                    </form>


                </div>
            </div>

        </div>
    </main>

    <!-- Page Footer -->
    <footer class="login-footer">
        <p>Copyright &copy; <span id="currentYear"></span> Arya. All rights reserved.</p>
        <span class="footer-note">Built with Spring Boot &amp; Thymeleaf</span>
    </footer>

    <!-- Password Toggle Script -->
    <script>
        document.getElementById('currentYear').textContent = new Date().getFullYear();

        const toggleBtn = document.getElementById('togglePasswordBtn');
        const passInput = document.getElementById('password');
        const eyeOn = document.getElementById('eyeIcon');
        const eyeOff = document.getElementById('eyeOffIcon');

        if (toggleBtn && passInput) {
            toggleBtn.addEventListener('click', function () {
                const isHidden = passInput.type === 'password';
                passInput.type = isHidden ? 'text' : 'password';
                eyeOn.style.display = isHidden ? 'none' : 'block';
                eyeOff.style.display = isHidden ? 'block' : 'none';
            });
        }
    </script>
</body>
</html>
