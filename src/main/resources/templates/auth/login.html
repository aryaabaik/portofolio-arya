<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login Admin - Arya Adhitya Portfolio">
    <title>Login Admin — Arya Adhitya</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/login.css}" href="/css/login.css">
</head>
<body>

    <!-- Ambient Glows -->
    <div class="ambient-glow ambient-glow-1"></div>
    <div class="ambient-glow ambient-glow-2"></div>

    <!-- Subtle Wave Lines Background -->
    <div class="login-backdrop-waves" aria-hidden="true">
        <svg viewBox="0 0 1440 600" fill="none" preserveAspectRatio="none">
            <path d="M0,220 C360,120 720,320 1080,200 C1240,150 1360,260 1440,210" stroke="rgba(47, 111, 163, 0.1)" stroke-width="1.5" stroke-dasharray="6 6"/>
            <path d="M0,320 C320,240 680,380 1040,290 C1200,240 1340,340 1440,300" stroke="rgba(22, 59, 99, 0.06)" stroke-width="1.2"/>
        </svg>
    </div>

    <!-- Top Bar -->
    <header class="login-topbar">
        <a th:href="@{/}" href="/" class="back-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span>Kembali</span>
        </a>
        <span class="topbar-portal-tag">Admin Portal</span>
    </header>

    <!-- Main Content -->
    <main class="login-main">
        <div class="login-card-container">
            <div class="auth-card">

                <!-- Dark Curved Top Section with Logo & Pattern -->
                <div class="auth-card-top">
                    <!-- Geometric Pattern Overlay -->
                    <div class="auth-card-pattern"></div>
                    <svg class="pattern-geometry-svg" viewBox="0 0 420 200" fill="none" aria-hidden="true">
                        <rect x="20" y="20" width="60" height="60" rx="16" fill="rgba(255,255,255,0.12)"/>
                        <rect x="90" y="50" width="40" height="40" rx="10" fill="rgba(255,255,255,0.08)"/>
                        <rect x="60" y="90" width="50" height="50" rx="14" fill="rgba(255,255,255,0.1)"/>
                        <circle cx="200" cy="40" r="25" fill="rgba(255,255,255,0.06)"/>
                        <rect x="300" y="30" width="55" height="55" rx="14" fill="rgba(255,255,255,0.1)"/>
                        <rect x="340" y="80" width="45" height="45" rx="12" fill="rgba(255,255,255,0.07)"/>
                        <rect x="270" y="100" width="35" height="35" rx="10" fill="rgba(255,255,255,0.09)"/>
                        <rect x="140" y="120" width="48" height="48" rx="13" fill="rgba(255,255,255,0.06)"/>
                    </svg>

                    <!-- Squircle Logo Badge -->
                    <div class="auth-logo-badge">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                        </svg>
                    </div>

                    <h1 class="auth-header-title">Login</h1>
                    <p class="auth-header-subtitle">Akses panel administrasi portofolio</p>
                </div>

                <!-- White Form Section -->
                <div class="auth-card-body">

                    <!-- Error Alert -->
                    <div th:if="${param.error != null}" class="auth-alert auth-alert-error" role="alert">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg>
                        <span>Username atau password tidak valid. Silakan coba kembali.</span>
                    </div>

                    <!-- Logout Alert -->
                    <div th:if="${param.logout != null}" class="auth-alert auth-alert-success" role="alert">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                            <polyline points="22 4 12 14.01 9 11.01"></polyline>
                        </svg>
                        <span>Anda telah berhasil keluar dari sesi.</span>
                    </div>

                    <!-- Login Form -->
                    <form th:action="@{/login}" action="/login" method="post" class="auth-form">

                        <!-- Username -->
                        <div class="form-field-group">
                            <label for="username" class="field-label">Username</label>
                            <div class="field-input-box">
                                <span class="field-icon" aria-hidden="true">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                        <circle cx="12" cy="7" r="4"></circle>
                                    </svg>
                                </span>
                                <input
                                    type="text"
                                    id="username"
                                    name="username"
                                    class="field-input"
                                    placeholder="Masukkan username"
                                    required
                                    autofocus
                                    autocomplete="username"
                                >
                            </div>
                        </div>

                        <!-- Password -->
                        <div class="form-field-group">
                            <label for="password" class="field-label">Password</label>
                            <div class="field-input-box">
                                <span class="field-icon" aria-hidden="true">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                    </svg>
                                </span>
                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    class="field-input"
                                    placeholder="Masukkan password"
                                    required
                                    autocomplete="current-password"
                                >
                                <button
                                    type="button"
                                    id="togglePasswordBtn"
                                    class="password-eye-toggle"
                                    aria-label="Tampilkan atau sembunyikan password"
                                    title="Lihat password"
                                >
                                    <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </svg>
                                    <svg id="eyeOffIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                        <line x1="1" y1="1" x2="23" y2="23"></line>
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <!-- Submit -->
                        <button type="submit" class="btn-auth-submit" id="loginBtn">
                            <span>Login</span>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                                <polyline points="12 5 19 12 12 19"></polyline>
                            </svg>
                        </button>

                    </form>

                    <!-- Footer Info -->
                    <div class="card-bottom-info">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                        </svg>
                        <span>Sistem Terenkripsi & Terproteksi</span>
                    </div>

                </div>

            </div>
        </div>
    </main>

    <!-- Page Footer -->
    <footer class="login-page-footer">
        <p>&copy; <span id="currentYear"></span> Arya Adhitya. All rights reserved.</p>
    </footer>

    <!-- Script -->
    <script>
        document.getElementById('currentYear').textContent = new Date().getFullYear();

        const toggleBtn = document.getElementById('togglePasswordBtn');
        const passInput = document.getElementById('password');
        const eyeOn = document.getElementById('eyeIcon');
        const eyeOff = document.getElementById('eyeOffIcon');

        if (toggleBtn && passInput) {
            toggleBtn.addEventListener('click', function () {
                const isHidden = passInput.type === 'password';
                passInput.type = isHidden ? 'text' : 'password';
                eyeOn.style.display = isHidden ? 'none' : 'block';
                eyeOff.style.display = isHidden ? 'block' : 'none';
            });
        }
    </script>
</body>
</html>
