<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portfolio - Profile Page">
    <title th:text="${profile.nama} + ' - Portfolio'">Portfolio</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/profile.css}">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">
        <a href="/" class="navbar-brand" th:text="${profile.nama}">PORTFOLIO</a>
        <ul class="navbar-links">
            <li><a href="/">Home</a></li>
            <li><a href="/profile" class="active">Profile</a></li>
            <li><a href="#details">About</a></li>
        </ul>
        <a href="#contact" class="navbar-contact">Contact</a>
    </nav>

    <!-- Hero Section -->
    <section class="hero-section">
        <div class="profile-photo-wrapper animate-fade-in">
            <img th:src="@{'/images/' + ${profile.foto}}"
                 th:alt="'Foto ' + ${profile.nama}"
                 class="profile-photo">
        </div>

        <div class="profile-info animate-fade-in-delay-1">
            <h1 class="profile-title" th:text="${profile.profesi}">Web Developer</h1>
        </div>

        <p class="profile-subtitle animate-fade-in-delay-2" th:text="${profile.deskripsi}">
            Deskripsi singkat tentang diri saya.
        </p>

        <div class="cta-group animate-fade-in-delay-3">
            <a href="#contact" class="btn-primary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
                Get in Touch
            </a>
            <a href="#" class="btn-secondary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
                Resume
            </a>
        </div>
    </section>

    <!-- Detail Cards -->
    <section id="details" class="details-section">

        <!-- Nama -->
        <div class="detail-card animate-fade-in-delay-2">
            <div class="detail-card-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </div>
            <p class="detail-card-label">Nama</p>
            <p class="detail-card-value" th:text="${profile.nama}">Nama</p>
        </div>

        <!-- Profesi -->
        <div class="detail-card animate-fade-in-delay-3">
            <div class="detail-card-icon">
                <svg viewBox="0 0 24 24">
                    <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                    <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                </svg>
            </div>
            <p class="detail-card-label">Profesi</p>
            <p class="detail-card-value" th:text="${profile.profesi}">Profesi</p>
        </div>

        <!-- Pendidikan -->
        <div class="detail-card animate-fade-in-delay-3">
            <div class="detail-card-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                    <path d="M6 12v5c0 2 3 3 6 3s6-1 6-3v-5"></path>
                </svg>
            </div>
            <p class="detail-card-label">Pendidikan</p>
            <p class="detail-card-value" th:text="${profile.pendidikan}">Pendidikan</p>
        </div>

        <!-- Lokasi -->
        <div class="detail-card animate-fade-in-delay-4">
            <div class="detail-card-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                    <circle cx="12" cy="10" r="3"></circle>
                </svg>
            </div>
            <p class="detail-card-label">Lokasi</p>
            <p class="detail-card-value" th:text="${profile.lokasi}">Lokasi</p>
        </div>

    </section>

    <!-- Footer -->
    <footer id="contact" class="footer">
        <p th:text="'Copyright ' + ${#dates.format(#dates.createNow(), 'yyyy')} + ' ' + ${profile.nama} + '. All rights reserved.'">
            Copyright 2026. All rights reserved.
        </p>
    </footer>

</body>

</html>
